name: XBT isolated validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free unused hosted-runner toolchains
        run: |
          # Disposable GitHub runner only; these SDKs are not used by this Rust/Nix job.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Confirm upstream development environment
        run: nix develop --command bash -c 'echo "IN_NIX_SHELL=$IN_NIX_SHELL"; command -v cargo; command -v bitcoind; command -v just'
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: xbt-slim-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            xbt-slim-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            xbt-slim-rust-${{ runner.os }}-
      - name: Check modified Ark library
        run: nix develop --command cargo check -p ark-lib -p bark-bitcoin-ext
      - name: Check unified digest tests
        run: |
          nix develop --command cargo test -p bark-bitcoin-ext unified
      - name: Check funded exit accounting
        run: nix develop --command cargo test -p ark-lib funded_

      - name: Build actual Ark regtest probe
        run: nix develop --command cargo build -p xbt-probe 2>&1 | tee probe-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-build-log
          path: probe-build.log
          retention-days: 3
      - name: Download pinned Knots test binary
        run: |
          curl -fL --retry 3 https://github.com/bitcoinknots/bitcoin/releases/download/v29.4.2.knots20260508/bitcoin-29.4.2.knots20260508-x86_64-linux-gnu.tar.gz -o /tmp/knots.tar.gz
          echo 'b59d0445a317e21a03dc29425db3aba79b27d5125230b1a2b1dce62e120827c5  /tmp/knots.tar.gz' | sha256sum -c -
          mkdir -p /tmp/xbt-knots
          tar -xf /tmp/knots.tar.gz -C /tmp/xbt-knots --strip-components=1
      - name: Private regtest consensus and replay checks
        run: XBT_BITCOIND=/tmp/xbt-knots/bin/bitcoind nix develop --command python3 testing/xbt_regtest.py
      - name: Default Knots policy funded recovery
        run: XBT_BITCOIND=/tmp/xbt-knots/bin/bitcoind nix develop --command python3 testing/xbt_default_policy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: default-policy-report
          path: xbt-default-policy-report.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-report
          path: xbt-regtest-report.json
          retention-days: 14
      - name: Check wallet and server
        if: ${{ !cancelled() }}
        run: nix develop --command cargo check -p bark-wallet -p bark-server
      - name: Build Bark client and server binaries
        timeout-minutes: 25
        run: nix develop --command cargo build -p bark-cli -p bark-server --bins 2>&1 | tee binary-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-build-log
          path: binary-build.log
          retention-days: 7
      - name: Private Bark client and server lifecycle
        timeout-minutes: 25
        run: |
          nix develop --command bash -euc '
            export XBT_BITCOIND=/tmp/xbt-knots/bin/bitcoind
            export BITCOIND_EXEC="$PWD/testing/xbt-bitcoind"
            export ASSUME_BUILT=1
            set -o pipefail
            just int "--test bark xbt_lifecycle --test-threads 1" 2>&1 | tee xbt-lifecycle.log
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-log
          path: |
            xbt-lifecycle.log
            test/xbt/lifecycle/**/*.log
          retention-days: 14
      - name: Preserve build cache after test failures
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbt-regtest-evidence
          path: |
            xbt-regtest-report.json
            xbt-lifecycle.log
            Cargo.lock
            test/xbt/lifecycle/**/*.log
          retention-days: 14
